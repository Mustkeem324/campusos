name: Library, Digital Resources & Research Validation

on:
  pull_request:
    paths:
      - 'apps/web/src/app/(dashboard)/library/**'
      - 'apps/web/src/app/(dashboard)/research/**'
      - 'apps/web/src/app/api/library/**'
      - 'apps/web/src/app/api/research/**'
      - 'apps/web/src/components/library/**'
      - 'apps/web/src/components/research/**'
      - 'apps/web/src/lib/library-*'
      - 'apps/web/src/lib/research-*'
      - 'apps/web/src/__tests__/library-membership-bootstrap.test.ts'
      - 'packages/db/prisma/library-operations.sql'
      - 'packages/db/prisma/research-operations.sql'
      - 'scripts/prepare-database.mjs'
      - 'vitest.config.ts'
      - 'test-stubs/**'
      - '.github/workflows/library-research-validation.yml'

permissions:
  contents: read

env:
  NODE_VERSION: '22'
  NEXT_TELEMETRY_DISABLED: '1'
  DATABASE_URL: postgresql://postgres:postgres@localhost:5432/campusos?schema=public
  JWT_SECRET: ci_only_jwt_secret_with_more_than_32_characters
  JWT_REFRESH_SECRET: ci_only_refresh_secret_with_more_than_32_characters

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: campusos
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres -d campusos"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - name: Install dependencies
        run: npm ci --no-audit --no-fund
      - name: Generate Prisma client
        run: npm run db:generate
      - name: Prisma validate
        run: npx prisma validate --schema=packages/db/prisma/schema.prisma
      - name: Create core database schema
        run: npx prisma db push --schema=packages/db/prisma/schema.prisma --skip-generate --accept-data-loss
      - name: Provision Library schema
        run: npx prisma db execute --file=packages/db/prisma/library-operations.sql --schema=packages/db/prisma/schema.prisma
      - name: Re-provision Library schema (idempotency)
        run: npx prisma db execute --file=packages/db/prisma/library-operations.sql --schema=packages/db/prisma/schema.prisma
      - name: Provision Research schema
        run: npx prisma db execute --file=packages/db/prisma/research-operations.sql --schema=packages/db/prisma/schema.prisma
      - name: Re-provision Research schema (idempotency)
        run: npx prisma db execute --file=packages/db/prisma/research-operations.sql --schema=packages/db/prisma/schema.prisma
      - name: Verify canonical student to program relation
        run: |
          node --input-type=module <<'NODE'
          import { PrismaClient } from '@prisma/client';
          const prisma = new PrismaClient();
          try {
            await prisma.$queryRawUnsafe(`
              SELECT b.program_id
              FROM public.students s
              JOIN public.batches b
                ON b.id = s.batch_id
               AND b.tenant_id = s.tenant_id
              LIMIT 0
            `);
          } finally {
            await prisma.$disconnect();
          }
          NODE
      - name: Typecheck
        run: npm run typecheck
      - name: Lint
        run: npm run lint -- --max-warnings=0
      - name: Library & research policy tests
        run: npx vitest run apps/web/src/__tests__/library-research-operations.test.ts apps/web/src/__tests__/library-membership-bootstrap.test.ts
      - name: Legacy research-service tests
        run: npx vitest run apps/web/src/__tests__/research-grants.test.ts apps/web/src/__tests__/patent-royalties.test.ts apps/web/src/__tests__/h-index-calculator.test.ts
      - name: Production build
        env:
          CAMPOSOS_AUTO_DB_PUSH: 'false'
        run: npm run build
