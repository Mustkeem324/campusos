name: Finance & Scholarship Validation

on:
  pull_request:
    paths:
      - 'apps/web/src/app/(dashboard)/finance/**'
      - 'apps/web/src/app/(public)/verify/receipt/**'
      - 'apps/web/src/app/api/finance/**'
      - 'apps/web/src/components/finance/**'
      - 'apps/web/src/lib/finance-*'
      - 'apps/web/src/lib/payment-*'
      - 'packages/db/prisma/finance-operations.sql'
      - 'packages/db/prisma/payment-portal.sql'
      - 'scripts/prepare-database.mjs'
      - 'vitest.config.ts'
      - 'test-stubs/**'
      - '.github/workflows/finance-validation.yml'

permissions:
  contents: read

env:
  NODE_VERSION: '22'
  NEXT_TELEMETRY_DISABLED: '1'
  DATABASE_URL: postgresql://postgres:postgres@localhost:5432/campusos?schema=public
  JWT_SECRET: ci_only_jwt_secret_with_more_than_32_characters
  JWT_REFRESH_SECRET: ci_only_refresh_secret_with_more_than_32_characters

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: campusos
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres -d campusos"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - name: Install dependencies
        run: npm ci --no-audit --no-fund
      - name: Generate Prisma client
        run: npm run db:generate
      - name: Create core database schema
        run: npx prisma db push --schema=packages/db/prisma/schema.prisma --skip-generate --accept-data-loss
      - name: Provision payment portal schema
        run: npx prisma db execute --file=packages/db/prisma/payment-portal.sql --schema=packages/db/prisma/schema.prisma
      - name: Provision Finance 2.0 schema
        run: npx prisma db execute --file=packages/db/prisma/finance-operations.sql --schema=packages/db/prisma/schema.prisma
      - name: Re-provision Finance 2.0 schema (idempotency)
        run: npx prisma db execute --file=packages/db/prisma/finance-operations.sql --schema=packages/db/prisma/schema.prisma
      - name: Typecheck
        run: npm run typecheck
      - name: Lint
        run: npm run lint -- --max-warnings=0
      - name: Money precision tests
        run: npx vitest run apps/web/src/__tests__/finance-money.test.ts
      - name: Finance policy & security tests
        run: npx vitest run apps/web/src/__tests__/finance-operations.test.ts
      - name: Payment webhook idempotency tests
        run: npx vitest run apps/web/src/__tests__/webhook-idempotency.test.ts
      - name: Legacy fee calculation tests
        run: npx vitest run apps/web/src/__tests__/fee-calculations.test.ts
      - name: Production build
        env:
          CAMPUSOS_AUTO_DB_PUSH: 'false'
        run: npm run build
