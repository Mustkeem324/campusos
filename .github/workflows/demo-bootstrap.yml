name: Demo database bootstrap verification

on:
  pull_request:
    paths:
      - 'scripts/bootstrap-demo.mjs'
      - 'scripts/prepare-database.mjs'
      - 'scripts/verify-demo-bootstrap.mjs'
      - 'packages/db/prisma/schema.prisma'
      - 'package.json'
      - '.github/workflows/demo-bootstrap.yml'
  push:
    branches:
      - main
    paths:
      - 'scripts/bootstrap-demo.mjs'
      - 'scripts/prepare-database.mjs'
      - 'scripts/verify-demo-bootstrap.mjs'
      - 'packages/db/prisma/schema.prisma'
      - 'package.json'
      - '.github/workflows/demo-bootstrap.yml'

permissions:
  contents: read

jobs:
  verify-demo-bootstrap:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: campusos_demo_bootstrap
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres -d campusos_demo_bootstrap"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/campusos_demo_bootstrap?schema=public
      NEXT_TELEMETRY_DISABLED: '1'

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install locked dependencies
        run: npm ci --no-audit --no-fund

      - name: Generate Prisma client
        run: npm run db:generate

      - name: Create clean database schema
        run: npx prisma db push --schema=packages/db/prisma/schema.prisma --skip-generate

      - name: Run demo bootstrap twice
        run: |
          npm run db:bootstrap-demo
          npm run db:bootstrap-demo

      - name: Verify connected demo records
        run: node scripts/verify-demo-bootstrap.mjs
