name: Transport GPS Validation

on:
  pull_request:
    paths:
      - 'apps/web/src/app/(dashboard)/transport/**'
      - 'apps/web/src/app/api/transport/**'
      - 'apps/web/src/components/campus/TransportAdminConsole.tsx'
      - 'apps/web/src/components/campus/TransportTrackerConsole.tsx'
      - 'apps/web/src/components/campus/TransportPhase2*.tsx'
      - 'apps/web/src/components/layout/Sidebar.tsx'
      - 'apps/web/src/lib/transport-gps*'
      - 'packages/db/prisma/transport-gps.sql'
      - 'scripts/prepare-database.mjs'
      - '.github/workflows/transport-gps-validation.yml'

permissions:
  contents: read

env:
  DATABASE_URL: postgresql://postgres:postgres@localhost:5432/campusos?schema=public

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: campusos
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres -d campusos"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npm run db:generate

      - name: Create core database schema
        run: npx prisma db push --schema=packages/db/prisma/schema.prisma --skip-generate --accept-data-loss

      - name: Provision transport GPS schema
        run: npx prisma db execute --file=packages/db/prisma/transport-gps.sql --schema=packages/db/prisma/schema.prisma

      - name: Re-provision transport GPS schema
        run: npx prisma db execute --file=packages/db/prisma/transport-gps.sql --schema=packages/db/prisma/schema.prisma

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint -- --max-warnings=0

      - name: Transport GPS unit tests
        run: npx vitest run apps/web/src/lib/transport-gps-sanitize.test.ts apps/web/src/lib/transport-gps-phase2.test.ts

      - name: Production build
        env:
          CAMPUSOS_AUTO_DB_PUSH: 'false'
        run: npm run build
