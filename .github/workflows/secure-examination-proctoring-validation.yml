name: Secure Examination & Proctoring Validation

on:
  pull_request:
    paths:
      - 'apps/web/src/app/(dashboard)/examinations/**'
      - 'apps/web/src/app/examinations/**'
      - 'apps/web/src/app/api/examinations/proctoring/**'
      - 'apps/web/src/components/examinations/**'
      - 'apps/web/src/lib/secure-examination*'
      - 'apps/web/src/lib/whip-whep-client.ts'
      - 'apps/secure-exam-client/**'
      - 'workers/exam-vision-worker.mjs'
      - 'infra/mediamtx.yml'
      - 'infra/exam-vision-worker.Dockerfile'
      - 'docker-compose.yml'
      - 'packages/db/prisma/exam-proctoring.sql'
      - 'packages/db/prisma/exam-proctoring-runtime.sql'
      - 'scripts/prepare-database.mjs'
      - '.env.example'
      - '.github/workflows/secure-examination-proctoring-validation.yml'

permissions:
  contents: read

env:
  DATABASE_URL: postgresql://postgres:postgres@localhost:5432/campusos?schema=public
  JWT_SECRET: ci_only_jwt_secret_with_more_than_32_characters
  JWT_REFRESH_SECRET: ci_only_refresh_secret_with_more_than_32_characters

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: campusos
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres -d campusos"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 20
          cache: npm
      - name: Install dependencies
        run: npm ci --no-audit --no-fund
      - name: Generate Prisma client
        run: npm run db:generate
      - name: Validate Prisma schema
        run: npx prisma validate --schema=packages/db/prisma/schema.prisma
      - name: Create core database schema
        run: npx prisma db push --schema=packages/db/prisma/schema.prisma --skip-generate --accept-data-loss
      - name: Provision secure examination schema
        run: npx prisma db execute --file=packages/db/prisma/exam-proctoring.sql --schema=packages/db/prisma/schema.prisma
      - name: Re-provision secure examination schema
        run: npx prisma db execute --file=packages/db/prisma/exam-proctoring.sql --schema=packages/db/prisma/schema.prisma
      - name: Provision realtime secure examination runtime
        run: npx prisma db execute --file=packages/db/prisma/exam-proctoring-runtime.sql --schema=packages/db/prisma/schema.prisma
      - name: Re-provision realtime secure examination runtime
        run: npx prisma db execute --file=packages/db/prisma/exam-proctoring-runtime.sql --schema=packages/db/prisma/schema.prisma
      - name: Verify secure examination storage
        run: |
          node --input-type=module <<'NODE'
          import { PrismaClient } from '@prisma/client';
          const prisma = new PrismaClient();
          try {
            const rows = await prisma.$queryRawUnsafe("SELECT to_regclass('campusos_exam_proctoring.exam_configs')::text AS configs, to_regclass('campusos_exam_proctoring.secondary_camera_sessions')::text AS second_camera, to_regclass('campusos_exam_proctoring.answer_revisions')::text AS answers, to_regclass('campusos_exam_proctoring.media_sessions')::text AS media, to_regclass('campusos_exam_proctoring.vision_jobs')::text AS vision_jobs, to_regclass('campusos_exam_proctoring.secure_client_attestations')::text AS client_attestations");
            const row = rows[0];
            if (!row?.configs || !row?.second_camera || !row?.answers || !row?.media || !row?.vision_jobs || !row?.client_attestations) process.exit(1);
          } finally {
            await prisma.$disconnect();
          }
          NODE
      - name: Validate standalone runtime scripts
        run: |
          node --check apps/secure-exam-client/launcher.mjs
          node --check workers/exam-vision-worker.mjs
      - name: Validate proctoring Docker composition
        run: docker compose --profile proctoring config --quiet
      - name: Typecheck
        run: npm run typecheck
      - name: Lint with zero warnings
        run: npm run lint -- --max-warnings=0
      - name: Secure examination policy tests
        run: npx vitest run apps/web/src/lib/secure-examination-policy.test.ts
      - name: Production build
        env:
          CAMPUSOS_AUTO_DB_PUSH: 'false'
        run: npm run build