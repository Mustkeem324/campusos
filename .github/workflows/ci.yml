name: CampusOS CI Pipeline

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: campusos-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: '22'
  NEXT_TELEMETRY_DISABLED: '1'
  DATABASE_URL: postgresql://postgres:postgres@localhost:5432/campusos?schema=public
  JWT_SECRET: ci_only_jwt_secret_with_more_than_32_characters
  JWT_REFRESH_SECRET: ci_only_refresh_secret_with_more_than_32_characters

jobs:
  quality-check:
    name: Lint, typecheck, test and build
    runs-on: ubuntu-latest
    timeout-minutes: 35

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: campusos
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres -d campusos"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install locked dependencies
        run: npm ci --no-audit --no-fund

      - name: Generate Prisma client
        run: npm run db:generate

      - name: Validate Prisma schema
        run: npx prisma validate --schema=packages/db/prisma/schema.prisma

      - name: Create ephemeral database schema
        run: npx prisma db push --schema=packages/db/prisma/schema.prisma --skip-generate --accept-data-loss

      - name: Lint with zero warnings
        run: npm run lint -- --max-warnings=0

      - name: Typecheck
        run: npm run typecheck

      - name: Run tests
        run: npm test

      - name: Build and verify Next.js output
        run: npm run build

      - name: Upload build diagnostics on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: campusos-build-diagnostics-${{ github.run_id }}
          if-no-files-found: ignore
          retention-days: 7
          path: |
            apps/web/.next/build-manifest.json
            apps/web/.next/routes-manifest.json
            apps/web/.next/prerender-manifest.json
            apps/web/.next/required-server-files.json

  dependency-audit:
    name: Production dependency audit report
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install locked dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Audit production dependencies
        id: audit
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          npm audit --omit=dev --audit-level=high 2>&1 | tee npm-audit.txt

      - name: Publish audit summary
        if: always()
        shell: bash
        run: |
          if [[ "${{ steps.audit.outcome }}" == "failure" ]]; then
            echo "::warning::Production dependency advisories were detected. Review the audit report and the framework-upgrade issue."
            {
              echo "## Production dependency audit"
              echo
              echo "The audit found advisories that require a reviewed framework upgrade. The quality build is still evaluated independently."
              echo
              echo '```text'
              cat npm-audit.txt
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
          else
            echo "## Production dependency audit" >> "$GITHUB_STEP_SUMMARY"
            echo "No high or critical production dependency advisories were reported." >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload audit report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: campusos-npm-audit-${{ github.run_id }}
          if-no-files-found: ignore
          retention-days: 14
          path: npm-audit.txt
