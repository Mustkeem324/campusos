name: NAVEMORA Scalability & Performance Validation

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  NODE_VERSION: '22'
  NEXT_TELEMETRY_DISABLED: '1'
  # Prisma schema validation requires DATABASE_URL to be defined even though
  # this workflow does not connect to PostgreSQL.
  DATABASE_URL: postgresql://postgres:postgres@localhost:5432/campusos?schema=public

jobs:
  architecture:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm run db:generate
      - run: npx prisma validate --schema=packages/db/prisma/schema.prisma
      - run: npm test -- platform-pagination
      - name: Verify performance assets
        run: test -f docs/SCALABILITY_ARCHITECTURE.md && test -f docs/DATABASE_PERFORMANCE.md && test -f docs/PERFORMANCE_TESTING.md && test -f scripts/performance/api-smoke.k6.js
