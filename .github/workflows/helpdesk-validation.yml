name: Helpdesk Validation

on:
  pull_request:
    paths:
      - 'apps/web/src/app/(dashboard)/helpdesk/**'
      - 'apps/web/src/app/(company-admin)/company-admin/support/**'
      - 'apps/web/src/app/api/helpdesk/**'
      - 'apps/web/src/app/api/company-admin/support/**'
      - 'apps/web/src/components/campus/RoleHelpdeskConsole.tsx'
      - 'apps/web/src/components/company-admin/CompanyInstitutionSupportInbox.tsx'
      - 'apps/web/src/lib/helpdesk*'
      - 'apps/web/src/lib/company-admin-support.ts'
      - 'packages/db/prisma/helpdesk.sql'
      - 'scripts/prepare-database.mjs'
      - '.github/workflows/helpdesk-validation.yml'

permissions:
  contents: read

env:
  DATABASE_URL: postgresql://postgres:postgres@localhost:5432/campusos?schema=public
  JWT_SECRET: ci_only_jwt_secret_with_more_than_32_characters
  JWT_REFRESH_SECRET: ci_only_refresh_secret_with_more_than_32_characters

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: campusos
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres -d campusos"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 20
          cache: npm
      - name: Install dependencies
        run: npm ci --no-audit --no-fund
      - name: Generate Prisma client
        run: npm run db:generate
      - name: Create core database schema
        run: npx prisma db push --schema=packages/db/prisma/schema.prisma --skip-generate --accept-data-loss
      - name: Provision helpdesk schema
        run: npx prisma db execute --file=packages/db/prisma/helpdesk.sql --schema=packages/db/prisma/schema.prisma
      - name: Re-provision helpdesk schema
        run: npx prisma db execute --file=packages/db/prisma/helpdesk.sql --schema=packages/db/prisma/schema.prisma
      - name: Typecheck
        run: npm run typecheck
      - name: Lint
        run: npm run lint -- --max-warnings=0
      - name: Helpdesk policy tests
        run: npx vitest run apps/web/src/lib/helpdesk-policy.test.ts
      - name: Production build
        env:
          CAMPUSOS_AUTO_DB_PUSH: 'false'
        run: npm run build
