name: Email Queue Drain

on:
  workflow_dispatch:
  schedule:
    - cron: '*/5 * * * *'

permissions:
  contents: read

concurrency:
  group: navemora-email-queue-drain
  cancel-in-progress: false

jobs:
  drain:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    env:
      APP_URL: ${{ vars.NAVEMORA_APP_URL }}
      CRON_SECRET: ${{ secrets.EMAIL_QUEUE_CRON_SECRET }}

    steps:
      - name: Configuration status
        run: |
          if [ -z "$APP_URL" ] || [ -z "$CRON_SECRET" ]; then
            echo "Email queue scheduler is not configured."
            echo "Set repository variable NAVEMORA_APP_URL and secret EMAIL_QUEUE_CRON_SECRET to enable it."
          else
            echo "Email queue scheduler configuration is present."
          fi

      - name: Drain email queue
        if: ${{ env.APP_URL != '' && env.CRON_SECRET != '' }}
        run: |
          base_url="${APP_URL%/}"
          curl \
            --fail-with-body \
            --silent \
            --show-error \
            --max-time 55 \
            --retry 2 \
            --retry-delay 5 \
            --header "x-cron-secret: $CRON_SECRET" \
            "$base_url/api/cron/process-email-queue"
