services:
  postgres:
    image: postgres:16-alpine
    container_name: campusos-postgres
    restart: always
    environment:
      POSTGRES_USER: campusos
      POSTGRES_PASSWORD: campusos_password
      POSTGRES_DB: campusos_db
    ports:
      - "${CAMPUSOS_POSTGRES_HOST_PORT:-5433}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U campusos -d campusos_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: campusos-redis
    restart: always
    ports:
      - "${CAMPUSOS_REDIS_HOST_PORT:-6380}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  minio:
    image: minio/minio:latest
    container_name: campusos-minio
    restart: always
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadminpassword
    ports:
      - "${CAMPUSOS_MINIO_API_PORT:-9000}:9000"
      - "${CAMPUSOS_MINIO_CONSOLE_PORT:-9001}:9001"
    command: server /data --console-address ":9001"
    volumes:
      - minio_data:/data

  mailhog:
    image: mailhog/mailhog:latest
    container_name: campusos-mailhog
    restart: always
    ports:
      - "${CAMPUSOS_MAILHOG_SMTP_PORT:-1025}:1025"
      - "${CAMPUSOS_MAILHOG_UI_PORT:-8025}:8025"

  mediamtx:
    profiles: ["proctoring"]
    image: bluenviron/mediamtx:1
    container_name: navemora-exam-mediamtx
    restart: unless-stopped
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      MTX_AUTHHTTPADDRESS: "${NAVEMORA_EXAM_MEDIA_AUTH_URL:-http://host.docker.internal:3000/api/examinations/proctoring/runtime/media-auth}"
      MTX_WEBRTCALLOWORIGINS: "${NAVEMORA_EXAM_MEDIA_ALLOWED_ORIGINS:-http://localhost:3000}"
      MTX_WEBRTCADDITIONALHOSTS: "${NAVEMORA_EXAM_MEDIA_ADDITIONAL_HOSTS:-}"
    ports:
      - "${NAVEMORA_EXAM_MEDIA_HTTP_PORT:-8889}:8889/tcp"
      - "${NAVEMORA_EXAM_MEDIA_ICE_PORT:-8189}:8189/udp"
    volumes:
      - ./infra/mediamtx.yml:/mediamtx.yml:ro

  exam-vision-worker:
    profiles: ["proctoring"]
    build:
      context: .
      dockerfile: infra/exam-vision-worker.Dockerfile
    container_name: navemora-exam-vision-worker
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      mediamtx:
        condition: service_started
    environment:
      DATABASE_URL: "postgresql://campusos:campusos_password@postgres:5432/campusos_db?schema=public"
      NAVEMORA_EXAM_MEDIA_INTERNAL_URL: "http://mediamtx:8889"
      NAVEMORA_EXAM_VISION_MEDIA_SECRET: "${NAVEMORA_EXAM_VISION_MEDIA_SECRET:-}"
      NAVEMORA_EXAM_VISION_INFER_URL: "${NAVEMORA_EXAM_VISION_INFER_URL:-}"
      NAVEMORA_EXAM_VISION_INFER_SECRET: "${NAVEMORA_EXAM_VISION_INFER_SECRET:-}"
      NAVEMORA_EXAM_VISION_POLL_MS: "${NAVEMORA_EXAM_VISION_POLL_MS:-3000}"

  communication-worker:
    profiles: ["communications"]
    build:
      context: .
      dockerfile: infra/communication-worker.Dockerfile
    container_name: navemora-communication-worker
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      mailhog:
        condition: service_started
    environment:
      DATABASE_URL: "postgresql://campusos:campusos_password@postgres:5432/campusos_db?schema=public"
      CAMPUSOS_COMMUNICATION_MODE: "${CAMPUSOS_COMMUNICATION_MODE:-development}"
      APP_PUBLIC_URL: "${APP_PUBLIC_URL:-http://host.docker.internal:3000}"
      NAVEMORA_COMMUNICATION_WORKER_CONCURRENCY: "${NAVEMORA_COMMUNICATION_WORKER_CONCURRENCY:-5}"
      NAVEMORA_COMMUNICATION_WORKER_POLL_MS: "${NAVEMORA_COMMUNICATION_WORKER_POLL_MS:-1500}"
      NAVEMORA_COMMUNICATION_WORKER_ID: "${NAVEMORA_COMMUNICATION_WORKER_ID:-}"
      NAVEMORA_EMAIL_PROVIDER: "${NAVEMORA_EMAIL_PROVIDER:-SMTP}"
      NAVEMORA_EMAIL_FROM: "${NAVEMORA_EMAIL_FROM:-NAVEMORA <noreply@navemora.local>}"
      NAVEMORA_EMAIL_REPLY_TO: "${NAVEMORA_EMAIL_REPLY_TO:-}"
      NAVEMORA_SMTP_HOST: "mailhog"
      NAVEMORA_SMTP_PORT: "1025"
      NAVEMORA_SMTP_SECURE: "false"
      NAVEMORA_SMS_PROVIDER: "${NAVEMORA_SMS_PROVIDER:-}"
      NAVEMORA_SMS_API_KEY: "${NAVEMORA_SMS_API_KEY:-}"
      NAVEMORA_SMS_API_SECRET: "${NAVEMORA_SMS_API_SECRET:-}"
      NAVEMORA_WHATSAPP_PROVIDER: "${NAVEMORA_WHATSAPP_PROVIDER:-}"
      NAVEMORA_WHATSAPP_ACCESS_TOKEN: "${NAVEMORA_WHATSAPP_ACCESS_TOKEN:-}"
      NAVEMORA_WHATSAPP_PHONE_NUMBER_ID: "${NAVEMORA_WHATSAPP_PHONE_NUMBER_ID:-}"
      NAVEMORA_TWILIO_ACCOUNT_SID: "${NAVEMORA_TWILIO_ACCOUNT_SID:-}"
      NAVEMORA_TWILIO_AUTH_TOKEN: "${NAVEMORA_TWILIO_AUTH_TOKEN:-}"
      NAVEMORA_SMS_FROM: "${NAVEMORA_SMS_FROM:-}"
      NAVEMORA_WHATSAPP_FROM: "${NAVEMORA_WHATSAPP_FROM:-}"
      NAVEMORA_COMMUNICATION_STATUS_CALLBACK_URL: "${NAVEMORA_COMMUNICATION_STATUS_CALLBACK_URL:-}"
      NAVEMORA_COMMUNICATION_CUSTOM_PROVIDER_URL: "${NAVEMORA_COMMUNICATION_CUSTOM_PROVIDER_URL:-}"
      NAVEMORA_COMMUNICATION_CUSTOM_PROVIDER_SECRET: "${NAVEMORA_COMMUNICATION_CUSTOM_PROVIDER_SECRET:-}"
      NAVEMORA_RESEND_API_KEY: "${NAVEMORA_RESEND_API_KEY:-}"
      NAVEMORA_SENDGRID_API_KEY: "${NAVEMORA_SENDGRID_API_KEY:-}"
      NAVEMORA_POSTMARK_SERVER_TOKEN: "${NAVEMORA_POSTMARK_SERVER_TOKEN:-}"

volumes:
  postgres_data:
  redis_data:
  minio_data:
