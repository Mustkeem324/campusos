services:
  postgres:
    image: postgres:16-alpine
    container_name: campusos-postgres
    restart: always
    environment:
      POSTGRES_USER: campusos
      POSTGRES_PASSWORD: campusos_password
      POSTGRES_DB: campusos_db
    ports:
      - "${CAMPUSOS_POSTGRES_HOST_PORT:-5433}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U campusos -d campusos_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: campusos-redis
    restart: always
    ports:
      - "${CAMPUSOS_REDIS_HOST_PORT:-6380}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  minio:
    image: minio/minio:latest
    container_name: campusos-minio
    restart: always
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadminpassword
    ports:
      - "${CAMPUSOS_MINIO_API_PORT:-9000}:9000"
      - "${CAMPUSOS_MINIO_CONSOLE_PORT:-9001}:9001"
    command: server /data --console-address ":9001"
    volumes:
      - minio_data:/data

  mailhog:
    image: mailhog/mailhog:latest
    container_name: campusos-mailhog
    restart: always
    ports:
      - "${CAMPUSOS_MAILHOG_SMTP_PORT:-1025}:1025" # SMTP server
      - "${CAMPUSOS_MAILHOG_UI_PORT:-8025}:8025" # Web UI

volumes:
  postgres_data:
  redis_data:
  minio_data:
